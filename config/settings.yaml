project:
  name: mtg-commander-analysis
  description: EDHREC Top 300 Past 2 Years pilot

pilot:
  source: EDHREC
  ranking: most_played_commanders
  timeframe: past_2_years
  cohort_size: 300
  snapshot_date: null # Set only when the ranking is captured.
  frozen_cohort: true

classification:
  prefer_precision_over_recall: true
  retain_match_evidence: true
  approaches:
    - baseline_text
    - sylvan_semantic
    - combined

sylvan_librarian:
  base_url: http://127.0.0.1:8000
  search_path: /search
  request_timeout_seconds: 30

data:
  raw_dir: data/raw
  reference_dir: data/reference
  processed_dir: data/processed
  reports_dir: reports
